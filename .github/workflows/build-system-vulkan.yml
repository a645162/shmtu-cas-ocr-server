name: Publish System Docker Images

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

env:
  DOCKER_HUB_REPO: a645162/shmtu-cas-ocr-server
  ALIYUN_ACR_REGION: cn-shanghai

jobs:
  prepare-environment:
    runs-on: ubuntu-24.04
    outputs:
      release-tag: ${{ steps.set-version.outputs.release-tag }}
      release-version: ${{ steps.set-version.outputs.release-version }}
      suite-version: ${{ steps.set-version.outputs.suite-version }}
      server-version: ${{ steps.set-version.outputs.server-version }}
      version-major: ${{ steps.set-version.outputs.version-major }}
      version-minor: ${{ steps.set-version.outputs.version-minor }}
      is-tag-release: ${{ steps.set-version.outputs.is-tag-release }}
      acr-registry: ${{ steps.set-acr.outputs.acr-registry }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release versions
        id: set-version
        run: |
          SUITE_VERSION="$(tr -d '\n\r' < VERSION)"
          RELEASE_TAG=""
          RELEASE_VERSION="${SUITE_VERSION}"
          IS_TAG_RELEASE="false"
          if ! [[ "${SUITE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version in VERSION: ${SUITE_VERSION}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_VERSION="${RELEASE_TAG#v}"
            IS_TAG_RELEASE="true"
            if [[ "${RELEASE_VERSION}" != "${SUITE_VERSION}" ]]; then
              echo "Tag version (${RELEASE_VERSION}) does not match VERSION (${SUITE_VERSION})." >&2
              exit 1
            fi
          fi
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "${SUITE_VERSION}"
          SERVER_VERSION="${SUITE_VERSION}"
          echo "release-tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release-version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "suite-version=${SUITE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "server-version=${SERVER_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "version-major=${VERSION_MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "version-minor=${VERSION_MAJOR}.${VERSION_MINOR}" >> "${GITHUB_OUTPUT}"
          echo "is-tag-release=${IS_TAG_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"
          echo "SUITE_VERSION=${SUITE_VERSION}" >> "${GITHUB_ENV}"
          echo "SERVER_VERSION=${SERVER_VERSION}" >> "${GITHUB_ENV}"
          echo "VERSION_MAJOR=${VERSION_MAJOR}" >> "${GITHUB_ENV}"
          echo "VERSION_MINOR=${VERSION_MAJOR}.${VERSION_MINOR}" >> "${GITHUB_ENV}"

      - name: Print release versions
        run: |
          echo "Release tag:    '${{ env.RELEASE_TAG }}'"
          echo "Release version:'${{ env.RELEASE_VERSION }}'"
          echo "Suite version:  '${{ env.SUITE_VERSION }}'"
          echo "Server version: '${{ env.SERVER_VERSION }}'"

      - name: Configure Aliyun ACR region
        id: set-acr
        run: |
          echo "acr-registry=registry.${ALIYUN_ACR_REGION}.aliyuncs.com" >> "${GITHUB_OUTPUT}"
          echo "ACR_REGISTRY=registry.${ALIYUN_ACR_REGION}.aliyuncs.com" >> "${GITHUB_ENV}"

      - name: Verify Aliyun ACR settings
        run: |
          echo "Aliyun ACR REGION=${{ env.ALIYUN_ACR_REGION }}"
          echo "Aliyun ACR REGISTRY=${{ env.ACR_REGISTRY }}"

  build-runtime-image:
    runs-on: ubuntu-24.04
    needs: prepare-environment
    strategy:
      matrix:
        include:
          - variant: cpu
            local_image: shmtu-cas-ocr-server:cpu
            bundled_local_image: shmtu-cas-ocr-server:cpu-bundled
            artifact_name: ubuntu-2404-cpu-artifacts
            build_dir: build/linux-system
            archive_name: shmtu-cas-ocr-server-cpu.tar
            bundled_archive_name: shmtu-cas-ocr-server-cpu-bundled.tar
          - variant: vulkan
            local_image: shmtu-cas-ocr-server:vulkan
            bundled_local_image: shmtu-cas-ocr-server:vulkan-bundled
            artifact_name: ubuntu-2404-vulkan-artifacts
            build_dir: build/linux-system-vulkan
            archive_name: shmtu-cas-ocr-server-vulkan.tar
            bundled_archive_name: shmtu-cas-ocr-server-vulkan-bundled.tar
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download model weights
        run: |
          python3 scripts/download_models.py

      - name: Verify host tools
        run: |
          docker --version
          python3 --version

      - name: Export program version
        run: |
          echo "RELEASE_VERSION=${{ needs.prepare-environment.outputs.release-version }}" >> "${GITHUB_ENV}"
          echo "SUITE_VERSION=${{ needs.prepare-environment.outputs.suite-version }}" >> "${GITHUB_ENV}"
          echo "SERVER_VERSION=${{ needs.prepare-environment.outputs.server-version }}" >> "${GITHUB_ENV}"

      - name: Build inside Docker and create runtime image
        run: |
          chmod +x scripts/docker_build_system.sh
          ./scripts/docker_build_system.sh "${{ matrix.variant }}"

      - name: Stage release executables
        run: |
          bash ./scripts/stage_binaries.sh \
            --build-dir "${{ matrix.build_dir }}" \
            --release-dir "release-assets/${{ matrix.variant }}" \
            --platform-id "ubuntu2404-linux-x64" \
            --variant "${{ matrix.variant }}"

      - name: Verify bundled and non-bundled images
        run: |
          chmod +x scripts/verify_runtime_images.sh
          ./scripts/verify_runtime_images.sh "${{ matrix.variant }}"

      - name: Export runtime images
        run: |
          docker save "${{ matrix.local_image }}" -o "${{ matrix.archive_name }}"
          docker save "${{ matrix.bundled_local_image }}" -o "${{ matrix.bundled_archive_name }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.build_dir }}/ocr/shmtu-cas-ocr-server/shmtu_cas_ocr_server*
            ${{ matrix.build_dir }}/ocr/shmtu-cas-ocr-cli/shmtu_cas_ocr_cli*
            docker-runtime/shmtu_cas_ocr_server
            docker-runtime/shmtu_cas_ocr_cli
            release-assets/${{ matrix.variant }}/*
            ${{ matrix.archive_name }}
            ${{ matrix.bundled_archive_name }}

  push-ghcr:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - prepare-environment
      - build-runtime-image
    strategy:
      matrix:
        include:
          - variant: cpu
            local_image: shmtu-cas-ocr-server:cpu
            bundled_local_image: shmtu-cas-ocr-server:cpu-bundled
            artifact_name: ubuntu-2404-cpu-artifacts
            archive_name: shmtu-cas-ocr-server-cpu.tar
            bundled_archive_name: shmtu-cas-ocr-server-cpu-bundled.tar
            tag_suffix: cpu
            publish_bare: "true"
            publish_variant_alias: "true"
          - variant: vulkan
            local_image: shmtu-cas-ocr-server:vulkan
            bundled_local_image: shmtu-cas-ocr-server:vulkan-bundled
            artifact_name: ubuntu-2404-vulkan-artifacts
            archive_name: shmtu-cas-ocr-server-vulkan.tar
            bundled_archive_name: shmtu-cas-ocr-server-vulkan-bundled.tar
            tag_suffix: vulkan
            publish_bare: "false"
            publish_variant_alias: "true"
    steps:
      - name: Export release versions
        run: |
          echo "SERVER_VERSION=${{ needs.prepare-environment.outputs.server-version }}" >> "${GITHUB_ENV}"
          echo "VERSION_MAJOR=${{ needs.prepare-environment.outputs.version-major }}" >> "${GITHUB_ENV}"
          echo "VERSION_MINOR=${{ needs.prepare-environment.outputs.version-minor }}" >> "${GITHUB_ENV}"

      - name: Download runtime image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./artifact

      - name: Load runtime images
        run: |
          docker load -i "./artifact/${{ matrix.archive_name }}"
          docker load -i "./artifact/${{ matrix.bundled_archive_name }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          TAGS=()
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            TAGS+=(
              "${SERVER_VERSION}"
              "${VERSION_MINOR}"
              "${VERSION_MAJOR}"
              "latest"
            )
          fi
          if [ "${{ matrix.publish_variant_alias }}" = "true" ]; then
            TAGS+=(
              "${SERVER_VERSION}-${{ matrix.tag_suffix }}"
              "${VERSION_MINOR}-${{ matrix.tag_suffix }}"
              "${VERSION_MAJOR}-${{ matrix.tag_suffix }}"
              "latest-${{ matrix.tag_suffix }}"
            )
          fi
          for tag in "${TAGS[@]}"; do
            docker tag "${{ matrix.local_image }}" "${IMAGE_BASE}:${tag}"
            docker push "${IMAGE_BASE}:${tag}"
          done

      - name: Tag and push bundled image to GHCR
        run: |
          IMAGE_BASE="ghcr.io/${{ github.repository }}"
          BUNDLED_TAGS=()
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            BUNDLED_TAGS+=(
              "${SERVER_VERSION}-bundled"
              "${VERSION_MINOR}-bundled"
              "${VERSION_MAJOR}-bundled"
              "latest-bundled"
            )
          fi
          if [ "${{ matrix.publish_variant_alias }}" = "true" ]; then
            BUNDLED_TAGS+=(
              "${SERVER_VERSION}-${{ matrix.tag_suffix }}-bundled"
              "${VERSION_MINOR}-${{ matrix.tag_suffix }}-bundled"
              "${VERSION_MAJOR}-${{ matrix.tag_suffix }}-bundled"
              "latest-${{ matrix.tag_suffix }}-bundled"
            )
          fi
          for tag in "${BUNDLED_TAGS[@]}"; do
            docker tag "${{ matrix.bundled_local_image }}" "${IMAGE_BASE}:${tag}"
            docker push "${IMAGE_BASE}:${tag}"
          done

  push-dockerhub:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - prepare-environment
      - push-ghcr
    strategy:
      matrix:
        include:
          - variant: cpu
            tag_suffix: cpu
            publish_bare: "true"
            publish_variant_alias: "true"
          - variant: vulkan
            tag_suffix: vulkan
            publish_bare: "false"
            publish_variant_alias: "true"
    steps:
      - name: Export release versions
        run: |
          echo "SERVER_VERSION=${{ needs.prepare-environment.outputs.server-version }}" >> "${GITHUB_ENV}"
          echo "VERSION_MAJOR=${{ needs.prepare-environment.outputs.version-major }}" >> "${GITHUB_ENV}"
          echo "VERSION_MINOR=${{ needs.prepare-environment.outputs.version-minor }}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy image from GHCR to Docker Hub
        run: |
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            IMAGE_REF="ghcr.io/${{ github.repository }}:${{ env.SERVER_VERSION }}"
          else
            IMAGE_REF="ghcr.io/${{ github.repository }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}"
          fi
          TAG_ARGS=()
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            TAG_ARGS+=(
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}"
              --tag "${{ env.DOCKER_HUB_REPO }}:latest"
            )
          fi
          if [ "${{ matrix.publish_variant_alias }}" = "true" ]; then
            TAG_ARGS+=(
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}-${{ matrix.tag_suffix }}"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}-${{ matrix.tag_suffix }}"
              --tag "${{ env.DOCKER_HUB_REPO }}:latest-${{ matrix.tag_suffix }}"
            )
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE_REF}"

          # Copy bundled image
          BUNDLED_REF="ghcr.io/${{ github.repository }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}-bundled"
          BUNDLED_ARGS=()
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            BUNDLED_ARGS+=(
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}-bundled"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}-bundled"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}-bundled"
              --tag "${{ env.DOCKER_HUB_REPO }}:latest-bundled"
            )
          fi
          if [ "${{ matrix.publish_variant_alias }}" = "true" ]; then
            BUNDLED_ARGS+=(
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}-bundled"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}-${{ matrix.tag_suffix }}-bundled"
              --tag "${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}-${{ matrix.tag_suffix }}-bundled"
              --tag "${{ env.DOCKER_HUB_REPO }}:latest-${{ matrix.tag_suffix }}-bundled"
            )
          fi
          docker buildx imagetools create "${BUNDLED_ARGS[@]}" "${BUNDLED_REF}"

  push-aliyun:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - prepare-environment
      - push-ghcr
    strategy:
      matrix:
        include:
          - variant: cpu
            tag_suffix: cpu
            publish_bare: "true"
            publish_variant_alias: "true"
          - variant: vulkan
            tag_suffix: vulkan
            publish_bare: "false"
            publish_variant_alias: "true"
    steps:
      - name: Export release versions
        run: |
          echo "SERVER_VERSION=${{ needs.prepare-environment.outputs.server-version }}" >> "${GITHUB_ENV}"
          echo "VERSION_MAJOR=${{ needs.prepare-environment.outputs.version-major }}" >> "${GITHUB_ENV}"
          echo "VERSION_MINOR=${{ needs.prepare-environment.outputs.version-minor }}" >> "${GITHUB_ENV}"
          echo "ACR_REGISTRY=${{ needs.prepare-environment.outputs.acr-registry }}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy image from GHCR to Aliyun ACR
        run: |
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            IMAGE_REF="ghcr.io/${{ github.repository }}:${{ env.SERVER_VERSION }}"
          else
            IMAGE_REF="ghcr.io/${{ github.repository }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}"
          fi
          TAG_ARGS=()
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            TAG_ARGS+=(
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:latest"
            )
          fi
          if [ "${{ matrix.publish_variant_alias }}" = "true" ]; then
            TAG_ARGS+=(
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}-${{ matrix.tag_suffix }}"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}-${{ matrix.tag_suffix }}"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:latest-${{ matrix.tag_suffix }}"
            )
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE_REF}"

          # Copy bundled image
          BUNDLED_REF="ghcr.io/${{ github.repository }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}-bundled"
          BUNDLED_ARGS=()
          if [ "${{ matrix.publish_bare }}" = "true" ]; then
            BUNDLED_ARGS+=(
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}-bundled"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}-bundled"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}-bundled"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:latest-bundled"
            )
          fi
          if [ "${{ matrix.publish_variant_alias }}" = "true" ]; then
            BUNDLED_ARGS+=(
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.SERVER_VERSION }}-${{ matrix.tag_suffix }}-bundled"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MINOR }}-${{ matrix.tag_suffix }}-bundled"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:${{ env.VERSION_MAJOR }}-${{ matrix.tag_suffix }}-bundled"
              --tag "${{ env.ACR_REGISTRY }}/${{ env.DOCKER_HUB_REPO }}:latest-${{ matrix.tag_suffix }}-bundled"
            )
          fi
          docker buildx imagetools create "${BUNDLED_ARGS[@]}" "${BUNDLED_REF}"

  publish-release:
    if: needs.prepare-environment.outputs.is-tag-release == 'true'
    runs-on: ubuntu-24.04
    needs:
      - prepare-environment
      - build-runtime-image
    steps:
      - name: Download CPU artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-2404-cpu-artifacts
          path: ./artifact/cpu

      - name: Download Vulkan artifacts
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-2404-vulkan-artifacts
          path: ./artifact/vulkan

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp ./artifact/cpu/release-assets/cpu/* release-assets/
          cp ./artifact/vulkan/release-assets/vulkan/* release-assets/
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
          ls -l release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-environment.outputs.release-tag }}
          name: ${{ needs.prepare-environment.outputs.release-tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
